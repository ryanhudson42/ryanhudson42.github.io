<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla login code</title>
<style>body{font-family:sans-serif;text-align:center;padding:2em}#c{font-size:1.6em;word-break:break-all;background:#eee;padding:1em;border-radius:8px}button{font-size:1.4em;padding:.6em 1.4em;margin-top:1em}</style></head>
<body><h1>Tesla authorization code</h1><div id="c"></div><button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent).then(()=>this.textContent='Copied!')">Copy code</button>
<p>Paste this code back into the chat.</p>
<script>var p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('No code. '+(p.get('error_description')||p.get('error')||''));</script></body></html>
